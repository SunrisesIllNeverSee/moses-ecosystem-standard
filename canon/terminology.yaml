stale_terms:
  - term: Commitment Conservation Theory
    replacement: Commitment Theory
    reason: Superseded framework name; conservation remains at the law level.
    source_refs: [ct-readme]

  - term: CCT
    replacement: CT
    reason: Superseded framework abbreviation.
    source_refs: [ct-readme]

  - term: "MO\xA7E\xA7"
    replacement: "MO\xA7ES\u2122"
    reason: Noncanonical double-section-sign rendering found in older materials.
    source_refs: [moses-site-data]

  - term: SigRank Standard
    replacement: TTEOP
    reason: >-
      The sigrank/0.1-draft measurement specification was renamed to TTEOP
      and is now maintained in the otep-spec repository. sigrank-standard is
      retained only as a legacy predecessor for backward compatibility.
    source_refs: [tteop-spec-readme, tteop-authority-architecture-directive-2026-09-02]

  - term: OTEP
    replacement: TTEOP
    reason: >-
      The protocol was renamed from "OTEP" to "TTEOP" on 2026-08-30 due to
      collision with OpenTelemetry Enhancement Proposals. The GitHub repo
      name otep-spec is retained for URL stability; the protocol name is
      TTEOP.
    source_refs: [tteop-spec-readme]
