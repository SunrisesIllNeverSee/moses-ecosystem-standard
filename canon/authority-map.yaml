#
# Projected from Search Authority master canon and owner directives.
# This is a public projection — the authoritative source is Search Authority.
#
# Maps each entity/repo to its authority class and owner. This standard does
# not independently invent canonical truth; every assignment traces to Search
# Authority.
#
# Governance rules:
#   - Exactly ONE MO§ES entity. Never duplicate it.
#   - Canonical display: MO§ES™. Accepted prose: MO§ES. Aliases: mos2es, MOSES.
#   - Never render: MO§E§ or MO§E§™.
#   - Do NOT collapse Signomy and CIVITAE.

authority_assignments:
