# MO§ES Ecosystem Standard — Machine-Readable Component Registry
#
# This is the canonical public component registry for the MO§ES ecosystem.
# It is a governed projection of the Search Authority entity graph and the
# ello-repo-control catalog.
#
# Governance:
#   - Every entry traces to Search Authority canon or owner-approved catalog.
#   - This registry does not independently invent canonical truth.
#   - Exactly ONE MO§ES entity. Never duplicate it.
#   - Canonical display: MO§ES™. Accepted prose: MO§ES. Aliases: mos2es, MOSES.
#   - Never render: MO§E§ or MO§E§™.
#
# Schema:
#   id              — stable identifier (matches Search Authority entity_id where applicable)
#   canonical_name  — canonical display name
#   aliases         — accepted alternative names
#   type            — component type (see SPEC.md §5.1)
#   role            — primary role (see SPEC.md §5.2)
#   family          — ecosystem family
#   authority_class — authority class (see SPEC.md §4.1)
#   authority_owner — which component owns canonical truth for this component
#   status          — owner_approved | source_supported | legacy | disputed
#   urls            — canonical URLs
#   description     — short description
#   relationships   — list of {predicate, target_id} pairs
#   version         — current version pin (where applicable)

