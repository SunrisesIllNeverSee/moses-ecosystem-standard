# ─── TTEOP Protocol Family ──────────────────────────────────────────────────

  - id: tteop
    canonical_name: TTEOP
    aliases: [otep-spec, tteop-spec, "Token Telemetry Evaluation Operator Protocol"]
    type: protocol
    role: authority
    family: sigrank
    authority_class: protocol_specification
    authority_owner: search_authority
    status: owner_approved
    urls:
      - https://github.com/SunrisesIllNeverSee/otep-spec
      - https://www.npmjs.com/package/tteop-spec
      - https://doi.org/10.5281/zenodo.22180349
    version: tteop/0.1-draft
    description: >-
      Open, vendor-neutral interoperability protocol for measuring AI
      operator token efficiency. Defines four telemetry primitives
      (I, O, W, R), five derived metrics, telemetry envelope schema,
      privacy modes, provenance levels, and conformance tests. SOLE
      interoperability protocol authority for the token telemetry
      measurement layer.
    relationships:
      - {predicate: implemented_by, target_id: tteop_spec}
      - {predicate: transported_by, target_id: tteop_mcp}
      - {predicate: used_by, target_id: upsilon}
      - {predicate: used_by, target_id: sigrank_mcp}
      - {predicate: has_legacy_alias, target_id: sigrank_standard_legacy}

  - id: tteop_spec
    canonical_name: tteop-spec
    aliases: [otep-spec package]
    type: standard
    role: reference
    family: sigrank
    authority_class: protocol_specification
    authority_owner: tteop
    status: owner_approved
    urls:
      - https://www.npmjs.com/package/tteop-spec
    version: 0.1.5-draft
    description: >-
      Executable/reference implementation of TTEOP canonical semantics.
      npm package. Owns metric formulas, null semantics, banker's
      rounding, and conformance vectors.
    relationships:
      - {predicate: implements, target_id: tteop}
      - {predicate: delegated_to_by, target_id: sigrank_cascade}

  - id: tteop_mcp
    canonical_name: tteop-mcp
    aliases: []
    type: transport
    role: transport
    family: sigrank
    authority_class: transport
    authority_owner: tteop
    status: owner_approved
    urls:
      - https://github.com/SunrisesIllNeverSee/tteop-mcp
    description: >-
      Thin MCP transport that delegates to tteop-spec. Does not define
      protocol semantics. stdout reserved for JSON-RPC; diagnostics on
      stderr.
    relationships:
      - {predicate: transports, target_id: tteop}
      - {predicate: delegates_to, target_id: tteop_spec}

  - id: sigrank_cascade
    canonical_name: "@sigrank/cascade"
    aliases: [sigrank-cascade]
    type: standard
    role: reference
    family: sigrank
    authority_class: product_implementation
    authority_owner: search_authority
    status: owner_approved
    urls:
      - https://www.npmjs.com/package/@sigrank/cascade
    version: 0.2.1
    description: >-
      SigRank product facade over TTEOP canonical semantics. Delegates
      computeMetrics() to tteop-spec. Maps output_fraction → snr,
      log_leverage → dev10x. Adds RS05 class taxonomy, operator
      signatures, field ranking. Does not redefine TTEOP semantics.
    relationships:
      - {predicate: delegates_to, target_id: tteop_spec}
      - {predicate: used_by, target_id: sigrank_mcp}

  - id: sigrank_standard_legacy
    canonical_name: sigrank-standard
    aliases: [sigrank/0.1-draft]
    type: legacy
    role: legacy_source
    family: sigrank
    authority_class: legacy_compatibility_source
    authority_owner: search_authority
    status: legacy
    urls:
      - https://github.com/SunrisesIllNeverSee/sigrank-standard
    description: >-
      LEGACY PREDECESSOR. Superseded by TTEOP. Retained only for
      backward compatibility and migration evidence. Legacy alias
      sigrank/0.1-draft resolves to tteop/0.1-draft, not to a second
      active standard.
    relationships:
      - {predicate: superseded_by, target_id: tteop}
      - {predicate: legacy_alias_resolves_to, target_id: tteop}

